<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up - Al-Ribat Manager</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2463eb",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<div class="min-h-screen flex flex-col justify-center items-center p-4 sm:p-6 lg:p-8">
<!-- Main Card Container -->
<div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-xl shadow-xl overflow-hidden border border-slate-200 dark:border-slate-800">
<!-- Header / Logo Section -->
<div class="px-8 pt-8 pb-6 text-center">
<div class="flex justify-center items-center gap-2 mb-6">
<div class="bg-primary text-white p-2 rounded-lg">
<span class="material-symbols-outlined text-2xl">account_balance</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-xl font-bold tracking-tight">Al-Ribat Manager</h2>
</div>
<h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100 mb-2">Create Account</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm">Join us to start managing your workspace</p>
</div>
<!-- Form Section -->
<div class="px-8 pb-8">
<form action="#" class="space-y-4" method="POST">
<!-- Full Name -->
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1" for="full-name">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">person</span>
<input class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none" id="full-name" name="full-name" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email -->
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
<input class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Phone -->
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1" for="phone">Phone Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">call</span>
<input class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none" id="phone" name="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<!-- Password -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
<input class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1" for="confirm-password">Confirm</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">check_circle</span>
<input class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none" id="confirm-password" name="confirm-password" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<!-- Terms Agreement -->
<div class="flex items-start gap-3 py-2">
<input class="mt-1 h-4 w-4 rounded border-slate-300 text-primary focus:ring-primary transition-all cursor-pointer" id="terms" name="terms" type="checkbox"/>
<label class="text-sm text-slate-600 dark:text-slate-400 leading-tight" for="terms">
                        I agree to the <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Sign Up Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-3 rounded-lg shadow-md hover:shadow-lg transition-all flex justify-center items-center gap-2" type="submit">
                    Sign Up
                </button>
<!-- Divider -->
<div class="relative flex py-4 items-center">
<div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
<span class="flex-shrink mx-4 text-slate-400 text-xs font-medium uppercase tracking-wider">Or continue with</span>
<div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
</div>
<!-- Social Login -->
<button class="w-full flex items-center justify-center gap-3 px-4 py-2.5 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-medium hover:bg-slate-50 dark:hover:bg-slate-700 transition-all" type="button">
<img alt="Google Logo" class="w-5 h-5" data-alt="Google colorful brand logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDUjNSNWvur5W0yRvO8kd_GWZGB0KbNx-ItkneLI1gnjb475oj0frsgGQ-ET0XrkYd3YWcAcpQ_qMFkuS5MaWyMvEdaWs6NGn7Yrb8XjV_gDLbvZ0KLRlSmbIq7zZMVzEMuBiRssEyIAnQ7QKv_gzpPecPKSZqCU64ACr1hT71KTbBxdhwPfdEYqApJcEmCmUy625G7MmCUNhKhaED62sDZeu2KSf9qqRMp8mPnQwgE0zbiocheiXXP_bDmRsJchge1xcTYbhlFf3M"/>
                    Continue with Google
                </button>
</form>
<!-- Sign In Link -->
<p class="mt-8 text-center text-sm text-slate-600 dark:text-slate-400">
                Already have an account? 
                <a class="text-primary font-semibold hover:underline" href="#">Sign In</a>
</p>
</div>
</div>
<!-- Footer Footer (Optional) -->
<div class="mt-8 text-center">
<p class="text-xs text-slate-500 dark:text-slate-500">© 2024 Al-Ribat Manager. All rights reserved.</p>
</div>
</div>
</body></html>
